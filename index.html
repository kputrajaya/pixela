<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixela</title>
  <link rel="stylesheet" href="site.css">
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col two">
        <h1 class="title">Pixela</h1>
        <h2 class="subtitle">Convert your images to triangle-mosaics!</h2>
        <div class="control">
          <div class="control-item">
            <label class="control-label" for="file">Image file:</label>
            <input id="file" type="file" accept="image/*">
            <label class="btn" for="file">Choose file</label>
          </div>
          <div class="control-item">
            <label class="control-label" for="count">Division count:</label>
            <select id="count">
              <option value="30">30</option>
              <option value="50">50</option>
              <option value="80">80</option>
              <option value="130">130</option>
              <option value="210">210</option>
              <option value="340">340</option>
              <option value="550" selected>550</option>
              <option value="890">890</option>
              <option value="1440">1440</option>
              <option value="2330">2330</option>
              <option value="3770">3770</option>
              <option value="6100">6100</option>
              <option value="9870">9870</option>
            </select>
          </div>
          <div class="control-item">
            <label class="control-label" for="type">Triangle per division:</label>
            <select id="type">
              <option value="2" selected>2</option>
              <option value="4">4</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col one">
        <img id="image" class="preview" alt="Original image preview" hidden>
      </div>
      <div class="col one">
        <canvas id="canvas" class="preview" role="img" aria-label="Generated triangle mosaic preview" hidden></canvas>
        <button id="download" class="btn" type="button" disabled hidden>Download</button>
      </div>
    </div>
  </div>
  <script src="site.js"></script>
</body>

</html>
